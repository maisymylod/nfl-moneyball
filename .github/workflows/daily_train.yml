name: daily-train

on:
  schedule:
    - cron: '0 11 * * *'   # 7am ET / 4am PT
  workflow_dispatch:

# Two runs sharing one rolling release would race on the state tarball.
concurrency:
  group: daily-train
  cancel-in-progress: false

env:
  STATE_TAG: daily-latest

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload the model and state assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # run_history.parquet and snapshots/ accumulate across runs and are no
      # longer in git, so the previous run's copies come from the release.
      # A missing asset is only expected on the very first run.
      - name: Restore accumulated state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/processed
          if gh release download "$STATE_TAG" --pattern state.tar.gz --dir . ; then
            tar -xzf state.tar.gz
            rm state.tar.gz
            echo "restored state: $(ls data/processed/snapshots | wc -l) snapshots"
          else
            echo "no state asset on $STATE_TAG; starting a fresh history"
          fi

      - name: Fetch stats
        run: python -m src.pipeline.fetch_stats

      - name: Fetch contracts
        run: python -m src.pipeline.fetch_contracts

      - name: Fetch fantasy ADP
        run: python -m src.pipeline.fetch_adp

      - name: Merge
        run: python -m src.pipeline.merge

      - name: Train model
        run: python -m src.model.train

      - name: Score
        run: python -m src.model.score

      - name: Fantasy draft value
        run: python -m src.model.fantasy_value

      - name: Diagnostic
        run: python -m src.reporting.diagnostic

      - name: Summary
        run: python -m src.reporting.summary

      - name: Append run history & snapshot
        run: python -m src.reporting.history

      - name: Export dashboard data for GitHub Pages
        run: python -m src.reporting.dashboard_export

      - name: Run tests
        run: |
          pip install pytest
          pytest -q

      # Publishing the artifacts instead of committing them keeps the default
      # branch free of the ~1MB/day of regenerated binaries.
      - name: Publish model and state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf state.tar.gz \
            data/processed/run_history.parquet \
            data/processed/snapshots
          cp models/latest.pkl model-latest.pkl

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Written to a file so the note text does not inherit YAML indentation.
          {
            echo "Rolling release. Both assets are replaced by each daily-train run."
            echo
            echo "Last updated $(date -u +%Y-%m-%d) by run [\`${GITHUB_RUN_ID}\`](${run_url})."
            echo
            echo "- \`model-latest.pkl\` - trained bundle (models, metrics, feature columns)."
            echo "- \`state.tar.gz\` - accumulated \`run_history.parquet\` and daily \`snapshots/\`."
          } > release-notes.md

          if gh release view "$STATE_TAG" >/dev/null 2>&1; then
            gh release edit "$STATE_TAG" --notes-file release-notes.md
          else
            gh release create "$STATE_TAG" \
              --title "Latest daily artifacts" \
              --notes-file release-notes.md
          fi

          gh release upload "$STATE_TAG" state.tar.gz model-latest.pkl --clobber

      # docs/data.json is generated above, so Pages is deployed from the build
      # rather than served from a committed copy on the default branch.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: train
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `enablement` is what actually writes build_type=workflow; without it
      # this step succeeds while Pages keeps serving the old `main:/docs`
      # source, which 404s the dashboard now that data.json is not committed.
      # Idempotent once set.
      - name: Configure Pages for Actions deployment
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
